name: Website or build problem
description: Something is wrong with the website itself or with building the book
title: "[Site] "
labels: ["type: infrastructure", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the page link, your browser, or the command you ran and its error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
