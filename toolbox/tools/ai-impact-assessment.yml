  rehost: false
passages:
  - id: design-risk-management-identification
    why: >-
      Its questions on bias, accuracy, reliability, data quality and security
      give your interdisciplinary team a ready checklist for listing risks
      before development starts.
  - id: deployment-governance-accountability-structures
    why: >-
      It assigns chapters to named roles and produces a written record of each
      decision, which gives a governance committee something concrete to review
      and sign off.
