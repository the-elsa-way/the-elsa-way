id: aif360
name: AI Fairness 360
full_name: AI Fairness 360 (AIF360)
summary: >-
  An open-source Python and R toolkit for measuring bias in datasets and models
  and for trying out algorithms that reduce it before, during or after training.
description: >-
  AIF360 bundles a large set of group and individual fairness metrics with more
  than ten bias mitigation algorithms, such as reweighing, adversarial debiasing
  and reject option classification. You wrap your data in its dataset classes,
  compute metrics per protected attribute, and then compare mitigation methods
  at the pre-processing, in-processing or post-processing stage. IBM Research
  created it in 2018 and moved it to the LF AI & Data Foundation in 2020.
  Development has slowed (the latest release, v0.6.1, dates from April 2024),
  but the repository still receives occasional fixes.
healthcare: >-
  In clinical AI you can use AIF360 to check whether labels, features or model
  predictions differ across groups such as sex, age band or ethnicity, and to
  test whether a mitigation step narrows that gap. Treat its metrics as a
  starting point: you still have to decide which disparities are clinically
  meaningful and which reflect real differences in disease prevalence.
