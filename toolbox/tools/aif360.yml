passages:
  - id: development-data-quality-fairness-detection
    why: >-
      Its dataset metrics let you compare label rates and outcomes across
      demographic groups in your training data before you train a model.
  - id: development-data-quality-fairness-correction
    why: >-
      It implements reweighing, resampling-style pre-processing and
      fairness-penalised training, so you can try several of the listed
      correction techniques on the same data and compare them.
