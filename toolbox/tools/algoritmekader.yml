id: algoritmekader
name: Algoritmekader
full_name: Algoritmekader (Dutch government Algorithm Framework)
summary: >-
  A Dutch government website that brings together the legal requirements,
  recommended measures and supporting tools for responsible use of algorithms
  and AI, organised by lifecycle phase, role and topic.
description: >-
  The Algoritmekader links each legal requirement (for example from the GDPR,
  the AI Act and non-discrimination law) to practical measures and to tools
  such as the IAMA and the AI Impact Assessment. You can filter by lifecycle
  phase, from problem analysis to decommissioning, by role, such as project
  leader, jurist or developer, and by topic, such as privacy, discrimination or
  procurement. It also has a section on the AI Act, with timelines and help
  to classify your system. The content is developed in the open on GitHub and
  updated in numbered releases; the site is in Dutch.
healthcare: >-
  It targets Dutch government bodies rather than health care, but public
  health organisations can use it to find which rules and measures apply at
  each stage of a clinical AI project.
url: https://minbzk.github.io/Algoritmekader/
