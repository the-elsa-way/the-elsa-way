passages:
  - id: design-legal-regulatory-country
    why: >-
      For Dutch projects it is the government's own map of which laws apply to
      an algorithm and what you need to do to comply with each one.
  - id: deployment-governance-accountability-structures
    why: >-
      Its role-based view shows who in the organisation is responsible for
      which measures, which helps you set up oversight and change management.
