passages:
  - id: design-risk-management-identification
    why: >-
      Its seven requirement areas give your interdisciplinary team a broad
      prompt list, so you catch ethical, societal and technical risks that a
      purely technical review would miss.
  - id: design-ethical-review-issues
    why: >-
      Many of its questions, on human oversight, non-discrimination,
      accountability and environmental well-being, line up with the ethical
      concerns you need to document during design.
