id: altai
name: ALTAI
full_name: Assessment List for Trustworthy Artificial Intelligence
summary: >-
  A self-assessment checklist from the EU High-Level Expert Group on AI that
  helps you test an AI system against the seven requirements for trustworthy
  AI and spot where you need extra measures.
description: >-
  ALTAI turns the 2019 Ethics Guidelines for Trustworthy AI into questions,
  grouped under seven requirements: human agency and oversight, technical
  robustness and safety, privacy and data governance, transparency,
  diversity, non-discrimination and fairness, societal and environmental
  well-being, and accountability. You answer them with a multidisciplinary
  team, ideally after a fundamental rights impact assessment, and pick the
  questions that fit your system and sector. It is a reflection tool, not a
  certification: completing it does not prove compliance. It comes as a PDF
  and as an interactive web version with extra explanatory notes.
healthcare: >-
  ALTAI is sector-neutral. In clinical AI it works well as a broad first pass
  over ethical and technical risks before you move to medical-device and AI
  Act specific checks.
url: https://digital-strategy.ec.europa.eu/en/library/assessment-list-trustworthy-artificial-intelligence-altai-self-assessment
developers:
