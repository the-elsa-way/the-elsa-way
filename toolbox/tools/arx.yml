id: arx
name: ARX
full_name: ARX Data Anonymization Tool
summary: >-
  Free desktop software and Java library for anonymising structured personal
  data, with built-in checks of re-identification risk and of how much useful
  information remains.
description: >-
  ARX lets you load a table, mark which columns are direct identifiers,
  quasi-identifiers or sensitive attributes, and define generalisation
  hierarchies (for example, exact age to five-year bands). It then searches for
  a transformation that meets privacy models you choose, such as k-anonymity,
  l-diversity, t-closeness or differential privacy, while keeping as much data
  utility as possible. Its graphical interface shows the estimated
  re-identification risk before and after anonymisation, which helps you
  document why the output is safe to share. ARX grew out of medical informatics research
  at the Technical University of Munich and is now developed together with the
  Berlin Institute of Health at Charité.
healthcare: >-
  ARX was built with biomedical data in mind and its developers present it as
  a tool for sharing research and clinical data. For a clinical AI project you
  can use it on tabular extracts, such as patient characteristics, diagnoses
  and lab results, before you share or publish them. It does not handle free
  text, DICOM headers or images, so you need other tools for those.
url: https://arx.deidentifier.org/
source_code: https://github.com/arx-deidentifier/arx
developers:
