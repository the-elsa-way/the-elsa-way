id: begeleidingsethiek
name: Aanpak Begeleidingsethiek
full_name: Aanpak Begeleidingsethiek (Guidance Ethics Approach)
summary: >-
  A facilitated workshop method in which the people affected by a new
  technology map its effects and values together and agree on concrete
  actions for the technology, its setting and its users.
description: >-
  Instead of asking whether a technology is acceptable, this approach asks how
  you can guide its use well. A workshop runs in three phases: you describe
  the technology in its concrete context, the participants name the actors,
  the effects they expect and the values at stake, and the group then
  formulates options for action on the technology itself, its environment and
  its users. A moderator and co-moderator lead the session, and the published
  manuals cover preparation, running the workshop and follow-up.
healthcare: >-
  The Dutch Ministry of Health (VWS) asked ECP to test the approach for AI in
  care. After pilots at LUMC, Trimbos Institute and SIZA, ECP published a
  dedicated manual for AI in healthcare, and the developers report use by more
  than 100 care organisations.
