passages:
  - id: design-stakeholder-engagement-when
    why: >-
      Because each workshop is about a concrete technology in a concrete
      setting, you can repeat it at different lifecycle stages to bring
      affected people in before key decisions are fixed.
  - id: deployment-clinical-integration-workflow
    why: >-
      The workshop asks staff, patients and managers how the AI changes their
      daily work and produces actions for the workflow, training and
      organisation around the tool.
