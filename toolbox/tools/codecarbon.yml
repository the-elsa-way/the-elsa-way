id: codecarbon
name: CodeCarbon
summary: >-
  An open-source Python package that estimates the electricity use and carbon
  emissions of your code while it runs, for measuring and reporting the
  footprint of training and running models.
description: >-
  You wrap your code in a tracker (or run it through the command-line tool),
  and CodeCarbon measures or estimates the power drawn by the CPU, GPU and
  RAM. It then multiplies that energy by the carbon intensity of the
  electricity grid where the computation runs. Results are saved to a file
  and can be viewed in a local or online dashboard. It covers compute on
  hardware you run yourself; it does not account for disk, network or
  cooling, and it does not track calls to remote generative AI APIs.
healthcare: >-
  Useful when a hospital or research group wants to report the environmental
  cost of training a clinical model, or to compare candidate models on
  emissions as well as accuracy.
