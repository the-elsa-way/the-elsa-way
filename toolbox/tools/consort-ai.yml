id: consort-ai
name: CONSORT-AI
full_name: Consolidated Standards of Reporting Trials, Artificial Intelligence extension
summary: >-
  An extension of the CONSORT checklist that tells you what to report when a
  randomised trial tests an intervention with an AI component.
description: >-
  CONSORT-AI adds 14 AI-specific items to the standard CONSORT checklist for
  reporting randomised controlled trials. The new items ask you to describe
  the AI intervention and the skills needed to use it, the setting it was
  built into, how its inputs and outputs were handled, how people interacted
  with it, and what you learned from analysing its errors. It was
  developed through an international consensus process together with
  SPIRIT-AI and published in 2020 in several journals at once, including
  Nature Medicine and The BMJ.
healthcare: >-
  Written specifically for clinical trials of AI interventions, so you can use
  it directly when you report a trial of a diagnostic, triage or treatment
  support system.
url: https://www.equator-network.org/reporting-guidelines/consort-artificial-intelligence/
developers:
  - SPIRIT-AI and CONSORT-AI Working Group
year: 2020
type: reporting-guideline
format: Checklist extension with explanatory paper
lifecycle: [evaluation]
future_ai: [traceability, general]
audiences: [researchers, healthcare-professionals]
practical:
