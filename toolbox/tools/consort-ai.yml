passages:
  - id: evaluation-reporting-transparency-standards
    why: >-
      This is the standard to follow when your evaluation is a randomised
      trial of an AI intervention.
  - id: evaluation-clinical-utility-safety-plan
    why: >-
      If your clinical evaluation plan points to a randomised trial, the
      checklist shows what you will need to record about the AI, its inputs and
      its use so that the trial can be reported in full.
