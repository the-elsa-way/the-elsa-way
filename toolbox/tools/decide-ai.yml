id: decide-ai
name: DECIDE-AI
full_name: Developmental and Exploratory Clinical Investigations of DEcision support systems driven by Artificial Intelligence
summary: >-
  A reporting checklist for small, early clinical studies of AI decision
  support, where you first test a tool with real users before a large trial.
description: >-
  DECIDE-AI covers the stage between building a model and running a
  large comparative trial: the first studies in which clinicians use the
  system with real patients. It has 17 AI-specific items and 10 generic ones,
  and asks you to report how the system was used in practice, how it fitted
  into the workflow, what human factors and usability issues came up, how
  safety was monitored and what changed in the tool during the study. It was
  agreed through an international consensus process and published in 2022 in
  Nature Medicine and The BMJ.
healthcare: >-
  Written for clinical decision support systems, so it fits first-in-clinic
  pilots, feasibility studies and silent or shadow-mode evaluations that come
  before a randomised trial.
url: https://www.equator-network.org/reporting-guidelines/reporting-guideline-for-the-early-stage-clinical-evaluation-of-decision-support-systems-driven-by-artificial-intelligence-decide-ai/
developers:
  - DECIDE-AI Expert Group (Baptiste Vasey, Peter McCulloch and colleagues)
year: 2022
type: reporting-guideline
format: Checklist with explanatory paper
lifecycle: [evaluation, deployment]
future_ai: [usability, traceability, general]
audiences: [researchers, healthcare-professionals, ai-developers]
practical:
