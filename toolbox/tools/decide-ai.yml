passages:
  - id: evaluation-clinical-utility-safety-plan
    why: >-
      If you cannot yet justify a full trial, the checklist helps you plan a
      smaller first clinical study that still collects the safety, usability
      and workflow evidence a later trial will need.
  - id: deployment-clinical-integration-workflow
    why: >-
      Its items on how the tool was actually used and fitted into care give
      you a structured way to record workflow problems during early roll-out.
  - id: evaluation-reporting-transparency-standards
    why: >-
      Use it to report early-stage clinical evaluations, the gap between
      model validation and a randomised trial.
