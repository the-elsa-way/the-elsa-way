id: ethical-matrix
name: Ethical Matrix
summary: >-
  A simple grid that makes you check, for every group affected by a
  technology, how it touches their wellbeing, autonomy and fairness, so you
  can weigh the concerns openly.
description: >-
  The rows of the matrix list the parties affected by a decision and the
  columns list three principles: wellbeing, autonomy and fairness. You fill
  each cell with the specific concern for that party, then discuss and weigh
  the cells as a group. The method borrows from principle-based medical
  ethics and was first applied to food and agricultural technologies, but it
  works for any new technology. It does not give you an answer; it makes the
  range of concerns and the way you weigh them explicit.
healthcare: >-
  Kelly et al. (2023) used an ethical matrix workshop, co-designed with a
  patient expert, to involve people with multiple sclerosis, radiologists,
  neurologists and computer scientists in research on AI in radiology.
