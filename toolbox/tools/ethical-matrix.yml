passages:
  - id: design-ethical-review-issues
    why: >-
      Filling in the matrix for patients, clinicians and other parties gives
      you a structured way to find and document the application-specific
      issues listed in this section.
  - id: design-social-impact-equity
    why: >-
      The fairness column asks, for each group, whether the AI would leave
      them better or worse off, which shows early where inequities could
      arise.
