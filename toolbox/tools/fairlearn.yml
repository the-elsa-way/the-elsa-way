id: fairlearn
name: Fairlearn
summary: >-
  An open-source Python library that breaks model performance down by subgroup
  and offers algorithms to reduce the gaps you find.
description: >-
  Fairlearn's MetricFrame lets you compute any scikit-learn style metric, such
  as sensitivity or calibration error, for every subgroup at once and report the
  differences or ratios between them. Its mitigation module includes
  reduction-based training methods and threshold post-processing that trade off
  overall accuracy against fairness constraints. The project began at Microsoft
  and is now run as a community-driven open-source project, with user guides
  that stress that fairness is a sociotechnical question rather than a purely
  technical one.
healthcare: >-
  For a clinical prediction model you can use Fairlearn to report sensitivity,
  specificity or other metrics separately for groups such as sex, age band or
  hospital site, which is what subgroup analyses in clinical evaluation call
  for. You still need to add confidence intervals and judge clinical
  significance yourself, because small subgroups make point estimates unstable.
url: https://fairlearn.org
source_code: https://github.com/fairlearn/fairlearn
developers:
