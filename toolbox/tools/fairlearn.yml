    url: https://www.jmlr.org/papers/v24/23-0389.html
passages:
  - id: evaluation-fairness-bias-measuring
    why: >-
      MetricFrame computes your primary metrics per subgroup and the largest
      between-group difference in one step, giving you the subgroup estimates
      this passage asks you to report.
  - id: development-data-quality-fairness-correction
    why: >-
      Its reduction methods add fairness constraints to training and its
      threshold optimiser adjusts outputs per group, two practical ways to
      apply bias-aware correction.
