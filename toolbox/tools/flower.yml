id: flower
name: Flower
summary: >-
  An open-source Python framework for federated learning, so you can train a
  model across several sites while patient data stays where it is.
description: >-
  With Flower you write a client app that trains on local data and a server app
  that combines the model updates, using a built-in strategy such as federated
  averaging or one you write yourself. It works with common machine learning
  libraries, including PyTorch, TensorFlow, scikit-learn, XGBoost and the
  medical imaging library MONAI. You can simulate a federation on one machine
  first and then deploy it across real sites. It also offers add-ons for
  differential privacy and secure aggregation, which reduce what the server can
  learn from a single site's updates. Flower started as a research project at
  the University of Oxford and is now maintained by Flower Labs with an open
  community.
healthcare: >-
  Federated learning suits multi-hospital projects where data-sharing
  agreements or the GDPR prevent pooling patient records. Note that federated
  training alone does not make a model private: model updates can still leak
  information, so combine it with differential privacy or secure aggregation
  and a security review.
