id: gripp2
name: GRIPP2
full_name: Guidance for Reporting Involvement of Patients and the Public, version 2
summary: >-
  A reporting checklist that helps you describe how patients and the public
  were involved in your research, what they did and what difference it made.
description: >-
  GRIPP2 comes in two forms. The long form has 34 items for studies whose
  main subject is patient and public involvement (PPI); the short form has
  five items (aim, methods, results, outcomes and critical reflection) for
  studies where PPI was part of the work but not its focus. It was
  developed with a three-round Delphi survey and a consensus meeting, with
  patients involved as research partners throughout. Using it when you plan
  involvement also reminds you what you will need to record.
healthcare: >-
  GRIPP2 was written for health and social care research and is listed by
  the EQUATOR Network. It applies directly when you involve patients in the
  design or evaluation of a medical AI study.
url: https://www.equator-network.org/reporting-guidelines/gripp2-reporting-checklists-tools-to-improve-reporting-of-patient-and-public-involvement-in-research/
