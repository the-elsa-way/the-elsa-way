id: iama
name: IAMA
full_name: Impact Assessment Mensenrechten en Algoritmes (Fundamental Rights and Algorithms Impact Assessment)
summary: >-
  A structured discussion guide that helps a public organisation decide whether
  and how to use an algorithm, with a step-by-step check of its effects on
  fundamental rights.
description: >-
  The IAMA is a long list of questions that a multidisciplinary team works
  through together before building, buying or using an algorithm. It moves from
  why you want the system, to the data and the model, to how it will be used,
  and ends with a dedicated part on fundamental rights where you weigh any
  interference against its purpose. The answers form a written record of the
  choices you made. The second version (February 2026) is shorter, comes with a
  separate explanatory document, and flags the questions that relate to the
  fundamental rights impact assessment required by Article 27 of the EU AI Act
  for certain deployers of high-risk AI systems. The current version is in
  Dutch; an English translation (FRAIA) exists for the first version.
healthcare: >-
  The IAMA was written for Dutch government bodies, not for health care, but its
  fundamental rights part is a useful way for a hospital to think through the
  effects of a clinical AI tool on patients. The AI Act's Article 27 duty only
  covers high-risk systems listed in Annex III, such as systems that decide on
  eligibility for healthcare services or triage emergency patients. Most
  clinical AI is high-risk because it is a medical device (Annex I), and then
  Article 27 does not apply; the IAMA can still serve as a voluntary check.
