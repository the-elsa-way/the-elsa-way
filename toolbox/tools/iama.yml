passages:
  - id: design-legal-regulatory-country
    why: >-
      The IAMA is the Dutch government's standard instrument for checking an
      algorithm against fundamental rights, and shows what a national framework
      expects in practice.
  - id: design-legal-regulatory-ai-act
    why: >-
      If your system falls under Annex III, for example emergency triage,
      version 2 marks the questions that map onto the AI Act's fundamental
      rights impact assessment that deployers must complete before first use.
