passages:
  - id: design-legal-regulatory-country
    why: >-
      In the Netherlands the IAMA is the government's standard instrument for
      checking an algorithm against fundamental rights, so it shows you what a
      national framework expects in practice.
  - id: design-legal-regulatory-ai-act
    why: >-
      Version 2 marks the questions that map onto the AI Act's fundamental
      rights impact assessment, so you can use it to prepare that obligation
      for a high-risk clinical AI system.
