id: mlflow
name: MLflow
summary: >-
  An open-source platform that records what went into each model run and keeps
  a versioned registry of trained models, which lets you trace any deployed
  model back to its code, data and settings.
description: >-
  MLflow Tracking logs the parameters, metrics, code version and output files of
  every training run, and lets you compare runs in a web interface. The Model
  Registry stores trained models with version numbers, stages and notes, which
  records which model is in use and how it was produced.
  Newer releases add tracing and evaluation features for applications built on
  large language models. Databricks launched MLflow in 2018, and it is now a
  Linux Foundation project; you can run it entirely on your own servers.
healthcare: >-
  For a clinical AI system, MLflow can provide part of the audit trail that
  regulators and hospital governance expect: which data version, code commit
  and hyperparameters produced the model version that is currently deployed.
  It does not replace Git or proper data versioning, but it links them to each
  model.
