passages:
  - id: development-documentation-version-control
    why: >-
      Each MLflow run records the code commit and settings used, and the
      registry numbers model versions, which helps you link every model version
      to the exact code and data behind it.
  - id: deployment-logging-traceability-what
    why: >-
      Store the registry's version identifier with each logged prediction, and
      every logged AI output can be traced to the model that produced it.
