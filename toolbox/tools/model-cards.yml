id: model-cards
name: Model Cards
full_name: Model Cards for Model Reporting
summary: >-
  A short, structured document that travels with a trained model and tells
  readers what it is for, how it was tested and where it performs worse.
description: >-
  A model card is a few pages of standard headings that you fill in for each
  model you release: details of the model, its intended and out-of-scope uses,
  the factors that may affect its behaviour, the metrics you chose, the
  training and evaluation data, results broken down by subgroup, ethical
  considerations, and caveats. The format was proposed by researchers at
  Google in 2018 and has since become a common way to publish models, for
  example on model-sharing platforms. You can write one in plain Markdown; no
  special software is needed.
healthcare: >-
  For a clinical model, the subgroup results and the out-of-scope uses are the
  parts readers need most: report performance by age, sex, ethnicity, site and
  device where you can, and say plainly which patients and settings the model
  was never tested on.
url: https://arxiv.org/abs/1810.03993
developers:
  - Margaret Mitchell
  - Timnit Gebru
  - Google
year: 2018
type: reporting-guideline
format: Documentation template (paper with example cards)
lifecycle: [development, evaluation, deployment]
