id: moral-medtech
name: Moral Medtech
summary: >-
  A cooperative serious game in which patients, clinicians, developers and
  regulators agree which values a medical AI tool must protect and turn them
  into design requirements.
description: >-
  Moral Medtech is a tabletop game for 3 to 8 players. You play through the
  development phases of an AI-driven medical technology, using value cards
  based on the EU requirements for trustworthy AI plus healthcare-specific
  values such as quality of care and life. In each round the group discusses
  and weighs the values at stake and ends with shared advice on what the
  product should offer at that phase. The game draws on Value Sensitive
  Design and agile methods, and you can replay it at several points during
  development.
healthcare: >-
  Built specifically for AI in healthcare with the Dutch Patient Federation
  (Patiëntenfederatie Nederland). The developers tested it on eight medtech
  use cases and report that it helped technical and non-technical
  stakeholders turn abstract values into concrete requirements.
url: https://www.hu.nl/onderzoek/projecten/moral-medtech-ethisch-ontwerpspel-voor-de-zorg
