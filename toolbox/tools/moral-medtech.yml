passages:
  - id: design-ethical-review-issues
    why: >-
      Playing the game with patients and clinicians surfaces concerns such as
      autonomy, discrimination and accountability for your specific
      application and records which ones the group finds most important.
  - id: design-stakeholder-engagement-when
    why: >-
      Because you can replay the game at each development phase, it gives
      patients, clinicians and developers a recurring, structured moment to
      weigh values together rather than a one-off consultation.
