passages:
  - id: evaluation-explainability-assessment-types
    why: >-
      SHAP produces the feature-importance type of explanation listed here;
      test its output with your clinical users to see whether it meets their
      needs.
  - id: development-human-ai-interaction-outputs
    why: >-
      Per-patient SHAP values can supply the supporting evidence shown next to
      a model's output, telling clinicians which inputs drove that prediction.
