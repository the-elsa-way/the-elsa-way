id: shap
name: SHAP
full_name: SHapley Additive exPlanations
summary: >-
  A Python library that explains individual predictions by estimating how much
  each input feature pushed the model's output up or down, based on Shapley
  values from game theory.
description: >-
  SHAP assigns every feature a contribution to a single prediction so that the
  contributions add up to the difference between that prediction and the
  average one. You can use fast exact explainers for tree ensembles, or slower
  model-agnostic and deep learning explainers for other models. The library also
  produces plots, such as waterfall, beeswarm and dependence plots, that show
  both single-case explanations and global patterns across a dataset. Keep in
  mind that SHAP explains the model's behaviour, not the causal effect of a
  feature on the patient.
healthcare: >-
  SHAP has a published clinical use by its own authors: Lundberg and colleagues
  (2018) used it to explain real-time predictions of hypoxaemia risk during
  surgery to anaesthesiologists. It works best for tabular data such as lab
  values and vital signs; for medical images, saliency methods are often
  easier for clinicians to read.
