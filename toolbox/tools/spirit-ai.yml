id: spirit-ai
name: SPIRIT-AI
full_name: Standard Protocol Items, Recommendations for Interventional Trials, Artificial Intelligence extension
summary: >-
  An extension of the SPIRIT checklist that tells you what to put in a
  clinical trial protocol when the intervention includes AI.
description: >-
  SPIRIT-AI adds 15 AI-specific items to the SPIRIT checklist for trial
  protocols. They ask you to state, before the trial starts, what the AI
  intervention is and what skills people need to use it, the setting it will
  be built into, how its input and output data will be handled, how people
  will interact with it, and how you will analyse its errors. It is the protocol companion to
  CONSORT-AI: plan with SPIRIT-AI, then report with CONSORT-AI. Both were
  published in 2020 in several journals, including Nature Medicine and The
  BMJ.
healthcare: >-
  Designed for interventional clinical trials of AI, so it fits directly when
  you write a protocol for a prospective trial of a clinical AI system.
url: https://www.equator-network.org/reporting-guidelines/spirit-artificial-intelligence/
developers:
  - SPIRIT-AI and CONSORT-AI Working Group
year: 2020
type: reporting-guideline
format: Checklist extension with explanatory paper
lifecycle: [evaluation]
future_ai: [traceability, general]
