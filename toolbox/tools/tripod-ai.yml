      2024;385:e078378.
    doi: 10.1136/bmj-2023-078378
passages:
  - id: evaluation-reporting-transparency-standards
    why: >-
      Use this checklist when your study develops or validates a prediction
      model, the most common design among the standards in this table.
  - id: evaluation-evaluation-planning-prespecification
    why: >-
      Reading the checklist before you start shows which analysis choices,
      such as subgroups and performance measures, you will later have to
      justify, so you can fix them in advance.
