id: tripod-ai
name: TRIPOD+AI
full_name: Transparent Reporting of a multivariable prediction model for Individual Prognosis Or Diagnosis, updated for AI
summary: >-
  A 27-item checklist for writing up studies that develop or validate a
  clinical prediction model, whether it uses regression or machine learning.
description: >-
  TRIPOD+AI tells you what to include when you report a diagnostic or
  prognostic prediction model study, from the title and abstract through data,
  analysis, results and discussion. It updates and replaces TRIPOD 2015 and
  adds items that matter for machine learning, such as how you handled
  fairness, data preparation and open science. A separate 13-item checklist
  covers abstracts, and an expanded version explains each item.
healthcare: >-
  Built for clinical prediction models in any specialty; use it for model
  development studies, external validation studies, or papers that do both.
url: https://www.equator-network.org/reporting-guidelines/tripod-statement/
developers:
  - TRIPOD+AI group (Gary S Collins, Karel G M Moons and colleagues)
year: 2024
type: reporting-guideline
format: Checklist with explanatory paper
lifecycle: [development, evaluation]
future_ai: [traceability, general]
audiences: [researchers, ai-developers]
practical:
  facilitator: not-needed
  skills: Research methods and basic statistics
  cost: free
  languages: [en]
maturity: established
license:
  name: CC-BY-4.0
  url: https://www.bmj.com/content/385/bmj-2023-078378
  rehost: true
references:
  - citation: >-
      Collins GS, Moons KGM, Dhiman P, Riley RD, Beam AL, Van Calster B, et al.
      TRIPOD+AI statement: updated guidance for reporting clinical prediction
