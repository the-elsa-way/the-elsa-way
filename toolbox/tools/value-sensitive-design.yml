id: value-sensitive-design
name: Value Sensitive Design
summary: >-
  A design approach, with ready-made methods and card decks, for
  identifying the people and human values a technology affects and building
  those values into the design from the start.
description: >-
  Value Sensitive Design (VSD) combines three kinds of investigation:
  conceptual work on which values and stakeholders matter, empirical work
  with the people involved, and technical work on how design choices support
  or undermine those values. It explicitly includes indirect stakeholders,
  people who never use the system but are affected by it. The VSD Lab at the
  University of Washington publishes toolkits such as the Envisioning Cards,
  a deck of prompts on stakeholders, time, values, pervasiveness and
  multi-lifespan effects that you can use in design sessions.
healthcare: >-
  The VSD Lab reports that the Envisioning Cards have been used in East
  Africa to help design national health care systems. VSD is also one of the
  foundations of the Moral Medtech game for medical AI.
