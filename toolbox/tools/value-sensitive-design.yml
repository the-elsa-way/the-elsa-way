passages:
  - id: design-stakeholder-engagement-when
    why: >-
      VSD treats stakeholder and value analysis as work that continues
      through the whole design process, and its focus on indirect
      stakeholders helps you see who to involve before decisions are fixed.
  - id: design-intended-use-requirements
    why: >-
      The Envisioning Cards prompt you to think about roles, contexts of use
      and long-term effects, which helps you write user requirements that
      cover more than the clinical function.
